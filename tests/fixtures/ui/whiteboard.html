<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Whiteboard - fixture</title>
<style>
  body { margin:0; height:100vh; background:#fbfbf8; background-image:radial-gradient(#d9d6cc 1px, transparent 1px); background-size:22px 22px;
         font-family:"Chalkboard SE", "Comic Sans MS", -apple-system, sans-serif; color:#1f2937; }
  .board { position:absolute; inset:60px 80px; }
  .eq { position:absolute; font-size:54px; letter-spacing:1px; }
  #eq1 { left:6%; top:12%; }
  #eq2 { left:6%; top:46%; }
  h1 { position:absolute; left:80px; top:14px; margin:0; font:600 18px -apple-system, sans-serif; color:#6b7280; }
  .tag { font:500 14px -apple-system, sans-serif; color:#9ca3af; display:block; margin-bottom:6px; }
</style>
</head>
<body>
<h1>Homework - Algebra, Unit 3</h1>
<div class="board">
  <div class="eq" id="eq1"><span class="tag">Problem 1</span>2x + 3 = 11</div>
  <div class="eq" id="eq2"><span class="tag">Problem 2</span>x&sup2; &minus; 5x + 6 = 0</div>
</div>
</body>
</html>
